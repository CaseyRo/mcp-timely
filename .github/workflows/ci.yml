name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # fastmcp 4: fail on any camelCase MCP field access instead of warning.
      FASTMCP_MCP_CAMELCASE_COMPAT: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest

      # Same gate as release.yml. It lives in both on purpose: without it here,
      # a new advisory shows green PR checks and fails only at release time,
      # where a failure leaves no tag and the old image keeps serving.
      - name: Security audit (pip-audit)
        run: uvx pip-audit
