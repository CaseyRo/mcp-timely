name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'tests/**'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
      packages: write
    env:
      KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Install and test
        run: |
          uv sync
          uv run pytest -x
        env:
          FASTMCP_MCP_CAMELCASE_COMPAT: "false"

      - name: Security audit (pip-audit)
        run: uvx pip-audit

      - name: Tag release
        id: version
        # Versions are git tags; nothing is committed or pushed to the branch
        # (protected). The tag push triggers no workflow: every workflow here
        # listens on branch pushes / PRs only. A re-run reuses HEAD's tag.
        run: |
          NEW=$(git tag --points-at HEAD --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$NEW" ]; then
            LAST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null \
              || echo "v$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)")
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST#v}"
            NEW="v$MAJOR.$MINOR.$((PATCH + 1))"
            git tag "$NEW"
            git push origin "refs/tags/$NEW"
          fi
          echo "version=${NEW#v}" >> "$GITHUB_OUTPUT"

      - name: Set image name
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest

      # Trigger a redeploy of the new :latest image via a signed webhook.
      # Runs after the GHCR push so the image is guaranteed to exist. Skipped
      # while the webhook secret is unset.
      - name: Trigger deploy
        if: env.KOMODO_WEBHOOK_SECRET != ''
        env:
          DEPLOY_URL: ${{ secrets.KOMODO_DEPLOY_URL }}
        run: |
          BODY='{"ref":"refs/heads/main","repository":{"full_name":"CaseyRo/mcp-timely"}}'
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$KOMODO_WEBHOOK_SECRET" | awk '{print $2}')

          HTTP_CODE=$(curl -s -o /tmp/deploy_response.txt -w "%{http_code}" \
            -X POST "$DEPLOY_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: sha256=${SIG}" \
            -d "$BODY")

          echo "Deploy status: ${HTTP_CODE}"
          cat /tmp/deploy_response.txt

          if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 300 ]]; then
            echo "ERROR: deploy trigger failed with HTTP ${HTTP_CODE}"
            exit 1
          fi
