services:
  mcp-timely:
    image: ghcr.io/caseyro/mcp-timely:latest
    restart: unless-stopped
    init: true
    ports:
      # Bind to the host's tailnet IP, never 0.0.0.0: Docker publishes 0.0.0.0 past ufw,
      # so only the Hetzner firewall would stand in front of it. BIND_IP comes from the
      # Komodo stack environment (nebula-1: its tailnet IP). Unset = compose refuses to
      # render, so the running container is left alone. Do NOT use 127.0.0.1: cloudflared
      # (host network) reaches this port via the tailnet IP. See fleet-stacks SECURITY.md.
      - "${BIND_IP:?set BIND_IP (tailnet IP) in the stack environment}:8011:8000"
    environment:
      - TRANSPORT=http
      - HOST=0.0.0.0
      - MCP_API_KEY=${MCP_API_KEY:-}
      - TIMELY_CLIENT_ID=${TIMELY_CLIENT_ID:-}
      - TIMELY_CLIENT_SECRET=${TIMELY_CLIENT_SECRET:-}
      # Rotating refresh tokens live here — the volume must persist.
      - TIMELY_TOKEN_FILE=/data/timely_tokens.json
    volumes:
      - timely-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  timely-data:
