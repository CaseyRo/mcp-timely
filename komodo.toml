[[stack]]
name = "git-mcp-timely-nebula"
description = "MCP server for Timely time tracking — question-shaped read tools"
deploy = true
tags = ["cdit"]

[stack.config]
server_id = "nebula-1"
git_provider = "github.com"
repo = "CaseyRo/mcp-timely"
branch = "main"
environment = """
MCP_API_KEY = [[MCP_TIMELY_API_KEY]]
TIMELY_CLIENT_ID = [[TIMELY_CLIENT_ID]]
TIMELY_CLIENT_SECRET = [[TIMELY_CLIENT_SECRET]]
"""
