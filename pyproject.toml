[project]
name = "mcp-timely"
version = "0.1.4"
description = "MCP server for Timely time tracking — question-shaped read tools (projects overview, time spent, work log)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Casey Romkes" }]
dependencies = [
    "fastmcp>=4.0.10,<5.0.0",
    "httpx>=0.28.1",
    "pydantic>=2.12",
    "pydantic-settings>=2.14.2",
    # Security floors (transitive deps of fastmcp; pinned to address CVEs)
    "authlib>=1.7.0",            # GHSA: CSRF in token cache handling
    "python-multipart>=0.0.32",  # GHSA: DoS via unbounded multipart headers
]

[project.urls]
Homepage = "https://github.com/CaseyRo/mcp-timely"

[project.scripts]
mcp-timely = "mcp_timely.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_timely"]

[tool.ruff.lint]
# Pinned to ruff 0.15's default selection. Declared explicitly because ruff
# changes its defaults between minors -- 0.16 additionally turns on I, UP, C4
# and RUF, which made a routine dependabot lock bump fail CI on seven
# pre-existing findings. Adopting a new lint family is a decision, not
# something a Monday-morning dependency PR should make for us.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.15.14",
]
